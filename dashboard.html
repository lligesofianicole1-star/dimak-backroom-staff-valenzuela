<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
body { background:#ffe5e5; font-family:Arial; color:#800000; padding:20px;}
h1 { font-weight:bold; text-align:center;}
#search { width:100%; padding:10px; border-radius:6px; border:1px solid #ffcccc; margin-bottom:15px;}
.record { background:#fff0f0; padding:15px; margin:10px 0; border-radius:10px; display:flex; align-items:center;}
.record img { width:80px; height:80px; border-radius:50%; margin-right:15px;}
</style>
</head>
<body>
<h1>Records Dashboard</h1>
<input type="text" id="search" placeholder="Search records..." onkeyup="filterRecords()">
<div id="records"></div>

<script>
async function loadRecords() {
    let response = await fetch('data.json');
    let users = await response.json();
    window.users = users; // store globally

    displayRecords(users);
}

function displayRecords(users) {
    let container = document.getElementById('records');
    container.innerHTML = '';
    users.forEach(user => {
        container.innerHTML += `
        <div class="record">
            <img src="${user.picture}" alt="Profile">
            <div><strong>${user.fullname}</strong><br>ID: ${user.username} | Email: ${user.email}</div>
        </div>`;
    });
}

function filterRecords() {
    let query = document.getElementById('search').value.toLowerCase();
    let filtered = window.users.filter(u => 
        u.fullname.toLowerCase().includes(query) || 
        u.username.toLowerCase().includes(query) || 
        u.email.toLowerCase().includes(query)
    );
    displayRecords(filtered);
}

loadRecords();
</script>
</body>
</html>
